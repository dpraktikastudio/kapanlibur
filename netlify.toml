[build]
  command = "npm install && npm run build"
  publish = "dist"

# Avoid duplicate home URL (/index.html vs /) for crawlers and caches.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/peta-liburan.html"
  to = "/"
  status = 301
  force = true
